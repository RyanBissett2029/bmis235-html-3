<div class="showcase"><!-- HTML: the bouncing-names area. The script adds the name buttons, and the card shows a fun fact when a name is clicked. -->
<div class="sc-wrap">
  <div class="sc-hint">Tap a name for a fun fact!</div>
  <div class="sc-stage" aria-label="Meet the brothers: click a name to see a fun fact">
    <div class="sc-card" role="dialog" aria-modal="false" aria-labelledby="sc-card-name" hidden>
      <div class="sc-card-name" id="sc-card-name"></div>
      <div class="sc-card-fact"></div>
      <div class="sc-card-actions">
        <button type="button" class="sc-btn sc-next">Another fact</button>
        <button type="button" class="sc-btn sc-close">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- CSS: colors, layout and look. Every rule starts with .showcase so nothing else on your page changes. -->
<style>
  .showcase .sc-wrap {
    font-family: Arial, Helvetica, sans-serif;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .showcase .sc-hint {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: bold;
    color: #06402B;
    text-align: center;
    margin: 0 0 8px 0;
    line-height: 20px;
  }
  .showcase .sc-stage {
    position: relative;
    width: 100%;
    height: min(440px, 70vh);
    min-height: 260px;
    background: #e8f7fb;
    border: 3px solid #009DC4;
    border-radius: 16px;
    overflow: hidden;
    box-sizing: border-box;
  }
  .showcase .sc-name {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    padding: 10px 20px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: bold;
    line-height: 1;
    color: #ffffff;
    background: #009DC4;
    border: 3px solid #06402B;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    will-change: transform;
    box-shadow: 0 4px 0 #06402B;
    -webkit-tap-highlight-color: transparent;
  }
  .showcase .sc-name:hover {
    background: #06402B;
    border-color: #009DC4;
    box-shadow: 0 4px 0 #009DC4;
  }
  .showcase .sc-name:focus-visible {
    outline: 3px dashed #06402B;
    outline-offset: 4px;
  }
  .showcase .sc-card {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(340px, calc(100% - 32px));
    box-sizing: border-box;
    padding: 22px 20px 18px;
    background: #06402B;
    color: #ffffff;
    border: 3px solid #009DC4;
    border-radius: 16px;
    text-align: center;
    z-index: 5;
    box-shadow: 0 10px 30px rgba(6, 64, 43, 0.35);
    animation: sc-pop 0.22s ease-out;
  }
  .showcase .sc-card[hidden] {
    display: none;
  }
  .showcase .sc-card-name {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 26px;
    font-weight: bold;
    color: #ffffff;
    margin: 0 0 10px 0;
  }
  .showcase .sc-card-fact {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    color: #ffffff;
    margin: 0 0 16px 0;
  }
  .showcase .sc-card-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .showcase .sc-btn {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: bold;
    padding: 9px 16px;
    border-radius: 999px;
    border: 2px solid #009DC4;
    cursor: pointer;
    margin: 0;
  }
  .showcase .sc-next {
    background: #009DC4;
    color: #ffffff;
  }
  .showcase .sc-close {
    background: transparent;
    color: #ffffff;
  }
  .showcase .sc-btn:hover {
    background: #ffffff;
    color: #06402B;
  }
  .showcase .sc-btn:focus-visible {
    outline: 3px dashed #ffffff;
    outline-offset: 3px;
  }
  @keyframes sc-pop {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @media (max-width: 480px) {
    .showcase .sc-name {
      font-size: 18px;
      padding: 8px 16px;
    }
  }
</style>

<!-- JavaScript: moves the names, bounces them off the edges, and opens the fun-fact card when a name is clicked. Edit the facts in the "brothers" list. -->
<script>
(function () {
  // ✏️ EDIT HERE: fun facts about each brother.
  var brothers = [
    { name: "Kyle", facts: [
      "Kyle is the youngest brother. He's only 2 minutes younger than me!",
      "Kyle goes to Washington State University. Go Cougs!"
    ]},
    { name: "John", facts: [
      "John is the second-youngest brother.",
      "John works for the Washington State Ferries."
    ]},
    { name: "Evan", facts: [
      "Evan is the oldest brother.",
      "Evan graduated from Gonzaga University. Go Zags!"
    ]}
  ];

  var script = document.currentScript;
  var scope = (script && script.closest(".showcase")) || document.querySelector(".showcase");
  if (!scope) return;
  var stage = scope.querySelector(".sc-stage");
  var card = scope.querySelector(".sc-card");
  var cardName = scope.querySelector(".sc-card-name");
  var cardFact = scope.querySelector(".sc-card-fact");
  var nextBtn = scope.querySelector(".sc-next");
  var closeBtn = scope.querySelector(".sc-close");

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var paused = false;
  var current = null;
  var lastFocus = null;
  var items = [];

  // Create a button for each name with a random direction.
  brothers.forEach(function (b) {
    var el = document.createElement("button");
    el.type = "button";
    el.className = "sc-name";
    el.textContent = b.name;
    el.setAttribute("aria-label", "Fun fact about " + b.name);
    stage.appendChild(el);

    var angle = Math.random() * Math.PI * 2;
    var item = { b: b, el: el, x: 0, y: 0, vx: Math.cos(angle), vy: Math.sin(angle), w: 0, h: 0, factIndex: -1 };
    items.push(item);

    el.addEventListener("click", function () { openCard(item); });
  });

  function measure() {
    var W = stage.clientWidth, H = stage.clientHeight;
    items.forEach(function (it, i) {
      it.w = it.el.offsetWidth;
      it.h = it.el.offsetHeight;
      if (!it.placed) {
        it.x = (W - it.w) * ((i + 0.5) / items.length);
        it.y = Math.random() * Math.max(0, H - it.h);
        it.placed = true;
      }
      it.x = Math.min(Math.max(0, it.x), Math.max(0, W - it.w));
      it.y = Math.min(Math.max(0, it.y), Math.max(0, H - it.h));
      draw(it);
    });
  }

  function draw(it) {
    it.el.style.transform = "translate(" + it.x + "px," + it.y + "px)";
  }

  // Animation loop: move each name and bounce it off the walls.
  var last = null;
  function tick(t) {
    if (last === null) last = t;
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    if (!paused && !reduceMotion) {
      var W = stage.clientWidth, H = stage.clientHeight;
      var speed = Math.max(60, Math.min(W, 700) * 0.18);
      items.forEach(function (it) {
        it.x += it.vx * speed * dt;
        it.y += it.vy * speed * dt;
        if (it.x <= 0) { it.x = 0; it.vx = Math.abs(it.vx); }
        if (it.x >= W - it.w) { it.x = W - it.w; it.vx = -Math.abs(it.vx); }
        if (it.y <= 0) { it.y = 0; it.vy = Math.abs(it.vy); }
        if (it.y >= H - it.h) { it.y = H - it.h; it.vy = -Math.abs(it.vy); }
        draw(it);
      });
    }
    requestAnimationFrame(tick);
  }

  // Fill the card with the next fact for that brother.
  function showFact(it) {
    it.factIndex = (it.factIndex + 1) % it.b.facts.length;
    cardName.textContent = it.b.name;
    cardFact.textContent = it.b.facts[it.factIndex];
    nextBtn.hidden = it.b.facts.length < 2;
  }

  function openCard(it) {
    lastFocus = it.el;
    current = it;
    paused = true;
    showFact(it);
    card.hidden = false;
    closeBtn.focus();
  }

  function closeCard() {
    card.hidden = true;
    paused = false;
    current = null;
    if (lastFocus) lastFocus.focus();
  }

  nextBtn.addEventListener("click", function () { if (current) showFact(current); });
  closeBtn.addEventListener("click", closeCard);
  scope.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !card.hidden) closeCard();
  });

  window.addEventListener("resize", measure);
  measure();
  requestAnimationFrame(tick);
})();
</script></div>
